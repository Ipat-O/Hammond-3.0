[package]
name = "hammond-mcp-companion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hammond-mcp-companion"
path = "src/main.rs"

[dependencies]
hammond-agent-access = { path = "../agent-access" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "io-util", "io-std", "time", "macros"] }
