[package]
name = "hammond-desktop"
version = "0.1.0"
description = "Hammond desktop application"
authors = ["Ipat-O"]
edition = "2021"

[lib]
name = "hammond_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
