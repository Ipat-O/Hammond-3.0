[package]
name = "hammond-desktop"
version = "0.1.0"
description = "Hammond desktop application"
authors = ["Ipat-O"]
edition = "2021"

[lib]
name = "hammond_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
